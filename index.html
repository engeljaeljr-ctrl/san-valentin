<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ti ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.contenedor {
    background: white;
    width: 90%;
    max-width: 420px;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: aparecer 1.2s ease;
}

h1 {
    color: #e63946;
    margin-bottom: 10px;
}

p {
    color: #444;
    font-size: 16px;
    line-height: 1.6;
}

.galeria {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    justify-content: center;
}

.galeria img {
    width: 90px;
    height: 120px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.galeria img:hover {
    transform: scale(1.1);
}

.corazon {
    font-size: 42px;
    animation: latir 1s infinite;
}

.boton {
    margin-top: 20px;
    padding: 14px 28px;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
}

.boton:hover {
    background: #d62828;
}

@keyframes latir {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="contenedor">
    <div class="corazon">❤️</div>

    <h1>Feliz San Valentín</h1>

    <p>
        Desde que llegaste, todo se siente distinto.  
        Tu sonrisa, tu forma de ser y cada momento contigo  
        hacen mis días más felices.
    </p>

    <!-- GALERÍA DE FOTOS -->
    <div class="galeria">
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">
    </div>

    <p>
        💌 ¿Aceptarías ser mi Valentín?
    </p>

    <button class="boton" onclick="mostrarAmor()">Sí 💕</button>
</div>

<script>
function mostrarAmor() {
    alert("Te amo ❤️");
}
</script>

</body>
</html>
