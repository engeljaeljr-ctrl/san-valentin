<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ti ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.contenedor {
    background: white;
    width: 90%;
    max-width: 430px;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: aparecer 1.2s ease;
}

h1 {
    color: #e63946;
    margin-bottom: 10px;
}

p {
    color: #444;
    font-size: 16px;
    line-height: 1.6;
}

.corazon {
    font-size: 42px;
    animation: latir 1s infinite;
}

/* GALERÍA */
.galeria {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 20px 0;
}

.galeria img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.galeria img:hover {
    transform: scale(1.05);
}

.boton {
    margin-top: 20px;
    padding: 14px 28px;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
}

.boton:hover {
    background: #d62828;
}

@keyframes latir {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="contenedor">
    <div class="corazon">❤️</div>

    <h1>Feliz San Valentín</h1>

    <p>
        Después de todo este tiempo, sigo eligiéndote cada día,
Gracias por caminar conmigo y quiero compartir mi vida contigo.
    </p>

    <!-- GALERÍA CON TUS FOTOS (NO RANDOM) -->
    <div class="galeria">
        <img src="IMG_1641.JPEG" alt="Foto 1">
        <img src="IMG_2096.JPEG" alt="Foto 2">
        <img src="IMG_2667.JPEG" alt="Foto 3">
        <img src="IMG_2692.JPEG" alt="Foto 4">
    </div>

    <p>
        💌 ¿Aceptarías ser mi Valentín?
    </p>

    <button class="boton" onclick="mostrarAmor()">Sí 💕</button>
</div>

<script>
function mostrarAmor() {
    alert("Te Mega amo ❤️");
}
</script>

</body>
</html>
