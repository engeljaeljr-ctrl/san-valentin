<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Ti ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carta {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: aparecer 1.5s ease;
        }

        h1 {
            color: #e63946;
        }

        p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
        }

        .corazon {
            font-size: 40px;
            animation: latir 1s infinite;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background: #e63946;
            color: white;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #d62828;
        }

        @keyframes latir {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="carta">
    <div class="corazon">❤️</div>
    <h1>Feliz San Valentín</h1>
    <p>
        Hoy no es un día cualquiera,  
        es un recordatorio de lo bonito que es tenerte.  
        Gracias por existir, por tu sonrisa  
        y por hacer mis días más especiales.
    </p>
    <p>
        💌 ¿Aceptarías ser mi San Valentín?
    </p>
    <button onclick="alert('Te quiero 💖')">Sí 💕</button>
</div>

</body>
</html>
